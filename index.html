<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹사이트 빌더</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <!-- 왼쪽: 상품링크 입력 -->
        <div class="left-panel">
            <div class="panel-header">상품링크</div>
            <div class="input-group">
                <label for="productUrl">URL 입력:</label>
                <input 
                    type="text" 
                    id="productUrl" 
                    placeholder="https://example.com" 
                    class="input-field"
                >
                <button class="add-btn" onclick="addProductLink()">추가</button>
            </div>
            <div id="linkList" class="link-list">
                <!-- 링크가 여기에 추가됨 -->
            </div>
        </div>

        <!-- 중간: 글자 입력 -->
        <div class="middle-panel">
            <div class="panel-header">글자 입력</div>
            <div class="input-group">
                <label for="textContent">텍스트:</label>
                <textarea 
                    id="textContent" 
                    class="textarea-field" 
                    placeholder="여기에 글을 입력하세요..."
                ></textarea>
                <button class="add-btn" onclick="updateMiddleContent()">반영</button>
            </div>
            <div id="middlePreview" class="preview-box">
                <!-- 미리보기 -->
            </div>
        </div>

        <!-- 오른쪽: HTML 미리보기 -->
        <div class="right-panel">
            <div class="panel-header">HTML 편집 및 미리보기</div>
            <div class="input-group">
                <label for="htmlContent">HTML 코드:</label>
                <textarea 
                    id="htmlContent" 
                    class="textarea-field html-editor" 
                    placeholder="&lt;div&gt;HTML을 입력하세요&lt;/div&gt;"
                ></textarea>
                <button class="add-btn" onclick="updatePreview()">미리보기</button>
            </div>
            <div id="preview" class="preview-box">
                <!-- HTML 미리보기 렌더링 -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
