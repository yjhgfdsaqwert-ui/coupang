<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>입력 페이지</title>

    <style>
        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
        }

        .container {
            display: flex;
            gap: 20px;
        }

        .box {
            flex: 1;
        }

        .title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        textarea {
            width: 100%;
            height: 500px;
            box-sizing: border-box;
            padding: 15px;
            font-size: 16px;
            resize: vertical;
        }

        /* 3번째 칸 */
        .fixed-content {
            width: 100%;
            height: 500px;
            box-sizing: border-box;
            padding: 15px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #f5f5f5;
            white-space: pre-wrap;
            overflow: auto;
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- 1번째 칸 -->
        <div class="box">
            <div class="title">상품 링크:</div>
            <textarea placeholder="상품 링크를 입력하세요"></textarea>
        </div>

        <!-- 2번째 칸 -->
        <div class="box">
            <div class="title">설명:</div>
            <textarea placeholder="내용을 입력하세요"></textarea>
        </div>

        <!-- 3번째 칸 -->
        <div class="box">
            <div class="title">HTML:</div>

            <div class="fixed-content">
여기에 HTML 파일에서 직접 작성한 내용을 넣으면 됩니다.

예:
<h1>안녕하세요</h1>
<p>이 내용은 파일에서만 수정할 수 있습니다.</p>
            </div>

        </div>

    </div>

</body>
</html>
