<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>coupang 대리구매 신청</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <!-- 왼쪽: 상품링크 입력 -->
        <div class="left-panel">
            <div class="panel-header">상품링크</div>
            <div class="input-group">
                <label for="productUrl">URL 입력:</label>
                <input 
                    type="text" 
                    id="productUrl" 
                    placeholder="상품 링크를 추가하시오" 
                    class="input-field"
                >
                <button class="add-btn" onclick="addProductLink()">추가</button>
            </div>
            <div id="linkList" class="link-list">
                <!-- 링크가 여기에 추가됨 -->
            </div>
        </div>

        <!-- 중간: 글자 입력 -->
        <div class="middle-panel">
            <div class="panel-header">코드 입력</div>
            <div class="input-group">
                <label for="textContent">코드:</label>
                <textarea 
                    id="textContent" 
                    class="textarea-field" 
                    placeholder="쿠팡 기프트 카드 코드를 입력하세요"
                ></textarea>
               
                <!-- 미리보기 -->
            </div>
        </div>

        <!-- 오른쪽: HTML 미리보기 -->
        <div class="right-panel">
            <div class="panel-header">안내사항</div>
            <div class="input-group">
                <label for="htmlContent">안내사항:</label>
                
                <!-- HTML 미리보기 렌더링 -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
