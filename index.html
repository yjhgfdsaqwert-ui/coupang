<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>입력 페이지</title>

    <style>
        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
        }

        .container {
            display: flex;
            gap: 20px;
            width: 100%;
        }

        .input-box {
            flex: 1;
        }

        .input-box textarea {
            width: 100%;
            height: 500px;
            padding: 15px;
            box-sizing: border-box;
            resize: vertical;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- 첫 번째 입력 칸 -->
        <div class="input-box">
            <textarea placeholder="첫 번째 글자를 입력하세요"></textarea>
        </div>

        <!-- 두 번째 입력 칸 -->
        <div class="input-box">
            <textarea placeholder="두 번째 글자를 입력하세요"></textarea>
        </div>

        <!-- 세 번째 입력 칸 -->
        <div class="input-box">
            <textarea placeholder="세 번째 글자를 입력하세요"></textarea>
        </div>

    </div>

</body>
</html>
