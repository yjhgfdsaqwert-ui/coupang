name = "coupang"
main = "worker.js"
compatibility_date = "2026-09-03"

[assets]
directory = "."
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[durable_objects]
bindings = [
  { name = "DISCORD_BOT", class_name = "DiscordBot" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DiscordBot"]
